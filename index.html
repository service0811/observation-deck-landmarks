<style>
:root { --bg: #eef1f4; --surface: #ffffff; --ink: #17202b; --muted: #5b6876; --line: #d5dce3; --accent: #1f5f8b; --pin: #e53935; --err: #b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f151b; --surface: #18212a; --ink: #e6ebf0; --muted: #94a2b0; --line: #2a3642; --accent: #7cb4dc; --pin: #f0544f; --err: #ff8a80; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font-family: var(--font, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif);
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.mark { width: 30px; height: 38px; position: relative; }
.mark::before { content: ""; position: absolute; left: 3px; top: 0; width: 24px; height: 24px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--pin); }
h1 { margin: 0; font-size: 20px; }
p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
label { font-size: 13px; color: var(--muted); }
input { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
button { font: inherit; font-size: 15px; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--surface); cursor: pointer; }
button:disabled { opacity: .6; }
input:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.err { color: var(--err); font-size: 13.5px; min-height: 1.2em; }
.row { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); }
.row input { width: auto; }
.langs { align-self: flex-end; display: flex; gap: 2px; background: var(--bg); border-radius: 999px; padding: 3px; margin-bottom: -6px; }
.langs button { background: transparent; color: var(--muted); font-size: 13px; font-weight: 700; min-width: 36px; height: 30px; padding: 0 8px; border-radius: 999px; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
/* password remembered on this device: no password form, just a quiet loading screen while the page opens */
.boot { display: none; flex-direction: column; align-items: center; gap: 18px; }
html.auto body { background: #05080b; }
html.auto form { display: none; }
html.auto .boot { display: flex; }
.boot .pin { width: 26px; height: 26px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #ef4b45; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }
.boot .sp { width: 26px; height: 26px; border-radius: 50%; border: 3px solid #26313b; border-top-color: #ffd54a; animation: sp .9s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .boot .sp { animation: none; } }
</style>
</head>
<body>
<div class="boot" aria-hidden="true"><div class="pin"></div><div class="sp"></div></div>

const KEYID = P.s + ":" + P.n;
function keyDb() { return new Promise((res, rej) => { const r = indexedDB.open("deck-keys", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function keyGet() { try { const db = await keyDb(); return await new Promise(res => { const q = db.transaction("k").objectStore("k").get(KEYID); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (x) { return null; } }
async function keyPut(k) { try { const db = await keyDb(); db.transaction("k", "readwrite").objectStore("k").put(k, KEYID); } catch (x) {} }
async function decryptWith(key) { return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.i) }, key, b64(P.c))); }
async function unlock(pw, keep) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.s), iterations: P.n, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = await decryptWith(key);
  if (keep) await keyPut(key);
  return html;
}
function show(html) { document.open(); document.write(html); document.close(); }
const f = document.getElementById("f"), err = document.getElementById("err"), btn = document.getElementById("go");
f.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  btn.disabled = true; btn.textContent = t("busy"); err.textContent = "";
  try {
    const keep = document.getElementById("remember").checked;
    const html = await unlock(pw, keep);
    try { if (keep) localStorage.setItem("deck-pw", pw); } catch (x) {}
    show(html);
  } catch (x) {
    err.textContent = window.crypto && crypto.subtle ? t("wrong") : t("nocrypto");
    btn.disabled = false; btn.textContent = t("open");
  }
});
(async () => {
  // the "is there a newer version?" check runs while the page is being unlocked, not before it
  const isFresh = fresh();
  let saved = null;
  try { saved = localStorage.getItem("deck-pw"); } catch (x) {}
  let html = null;
  if (saved) { const k = await keyGet(); if (k) { try { html = await decryptWith(k); } catch (x) {} } }
  if (saved && html == null) { try { html = await unlock(saved, true); } catch (x) { try { localStorage.removeItem("deck-pw"); } catch (y) {} document.documentElement.classList.remove("auto"); } }
  if (!(await isFresh)) return;
  if (html != null) show(html);
})();
})();
</script>
